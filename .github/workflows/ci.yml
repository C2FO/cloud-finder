name: CI
on: push
jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
        - '1.14'
        - '1.15'
        - '1.16'
        - '1.17'
      fail-fast: false
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
    - uses: actions/setup-go@424fc82d43fa5a37540bae62709ddcc23d9520d4 #2.1.5
      with:
        go-version: ${{ matrix.go }}
    - name: Run Tests
      run: make test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
    - run: make docker-image
